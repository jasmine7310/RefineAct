[project]
name = "refineact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas",
    "tqdm",
    "rouge-score",
    "tiktoken==0.9.0",
    "python-dotenv==1.0.0",
    "langchain==0.0.277",
    "openai==0.28",
    "anthropic>=2.8,<3",
    "wikipedia",
]

[dependency-groups]
dev = ["black"]

[project.scripts]
refineact = "refineact:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
